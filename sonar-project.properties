sonar.organization=gauthiercpx
sonar.projectKey=bootstrapper
sonar.projectName=bootstrapper
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11,3.12
# Template and addon payloads are Jinja sources rendered into other people's
# projects, not this project's own code -- ruff and mypy exclude them for the
# same reason (see pyproject.toml).
sonar.exclusions=src/bootstrapper/templates/*/files/**,src/bootstrapper/addons/*/files/**
sonar.python.coverage.reportPaths=coverage.xml
