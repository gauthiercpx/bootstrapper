name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest

  generated-project:
    name: Generated project passes its own checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bootstrapper
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate a project
        run: bootstrapper new "Market API" -o /tmp/out --no-git --yes

      # The point of a scaffolder is that what it emits is green on day one.
      # If this job fails, the templates are broken even when the unit tests pass.
      - name: Install and check it
        working-directory: /tmp/out/market-api
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src
          pytest

      - name: Migrations apply
        working-directory: /tmp/out/market-api
        env:
          MARKET_API_DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic revision --autogenerate -m "initial"
          alembic upgrade head
          alembic downgrade base
