name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: quality
    env:
      # Job-level so a step `if:` can check it -- secrets aren't readable
      # directly in `if:` conditions. Empty until SONAR_TOKEN is added as a
      # repo secret; the step below no-ops rather than failing until then.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # SonarCloud needs full history for blame and new-code detection

      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: env.SONAR_TOKEN != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coverage
        if: env.SONAR_TOKEN != ''
        run: pytest --cov=src --cov-report=xml

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

  generated-project:
    name: Generated project passes its own checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bootstrapper
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate a project
        run: bootstrapper new "Market API" -o /tmp/out --no-git --yes

      # The point of a scaffolder is that what it emits is green on day one.
      # If this job fails, the templates are broken even when the unit tests pass.
      - name: Install and check it
        working-directory: /tmp/out/market-api
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src
          pytest

      - name: Migrations apply
        working-directory: /tmp/out/market-api
        env:
          MARKET_API_DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic revision --autogenerate -m "initial"
          alembic upgrade head
          alembic downgrade base
